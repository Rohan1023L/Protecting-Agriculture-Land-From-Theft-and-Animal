<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Protecting Agriculture Land From Animals/Theft | User Details</title>
    <link rel="stylesheet" href="../styles/Login_Account.css" />
</head>

<body>
    <header>
        <div><b>Protecting Agriculture Land From Animals/Theft</b></div>

        <nav>
            <div class="nav_mobile"></div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="">Help</a></li>
                <li><a href="">About Us</a></li>
            </ul>
        </nav>
    </header>
    <main>

        <form id="loginForm" action="../src/php/Login_Account.php" method="POST">
            <div class="create-account-heading">
                <div class="box">
                    <div class="create-account-box"></div>
                </div>


                <div class="heading-title-subtitle">
                    <div id="heading-title"><b>LOGIN IN ACCOUNT</b></div>
                    <div id="heading-subtitle">Welcome! BACK FILL DETAILS TO PROCED.</div>
                </div>
            </div>

            <div class="create-account">

                <div class="alignment-horizontal">
                    

                    <div class="align-label-input">
                        <label for="Email">Email ID</label>
                        <input type="email" id="Email" name="Email" placeholder="Enter Your Email Address">
                    </div>

                </div>

                <div class="alignment-horizontal">

                    <div class="align-label-input">
                        <label for="Password">Password</label>
                        <input type="password" id="Password" name="Password" placeholder="Enter Your Password">
                    </div>
                </div>

                <div class="alignment-horizontal">
                    <div class="chekbox-link-alignment">
                        <br>
                        <a href="">Forget Password ?</a>
                        <div id="message" style="height: 10px;padding-block: 10px; margin-block: 6px;"></div>
                    </div>

                    <div class="checkbox-alignment">
                        <input type="checkbox" id="checkbox">
                        <label for="checkbox">Show Password</label>

                        <script>
                            const checkbox = document.getElementById("checkbox");
                            const passwordInput = document.getElementById("Password");

                            checkbox.addEventListener("change", function () {
                                if (this.checked) {
                                    passwordInput.type = "text";
                                } else {
                                    passwordInput.type = "password";
                                }
                            });
                        </script>
                    </div>
                </div>

            </div>

            <div class="create-account-button">
                <button type="submit">Login Account</button>
                <button id="ReturnHome">Cancel</button>

                <script>
                    const indexHtml = document.getElementById('ReturnHome');
                    indexHtml.addEventListener('click', function () {
                        event.preventDefault();
                        location.href = '../index.html';
                    })
                </script>
            </div>

            <footer>
                <b><u>Notice :</u></b><br><br>
                This project is currently under development it take few day for completion of this project.
            </footer>
        </form>
        <aside>
            <img src="../assets/images/RaspberryPi.jpg" id="imgSet">

            <div>
                <br>
                <br>
                <b><u>Fig.</u> <u>Control</u> <u>System</u> <u>( PALFA/T )</u></b>
            </div>
        </aside>
    </main>
    <script src="../utils/Login_Account.js"></script>
</body>

</html>
